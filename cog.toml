ignore_merge_commits = true
ignore_fixup_commits = true

# `cog bump --auto` on master, once there is something to release: the tag triggers the release
tag_prefix = "v"
branch_whitelist = ["master"]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "shakvalang"
repository = "shakva"
