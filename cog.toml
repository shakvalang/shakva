ignore_merge_commits = true
ignore_fixup_commits = true

# `cog bump --auto` on master, once there is something to release: the tag triggers the release
tag_prefix = "v"
branch_whitelist = ["master"]

# docs.yml's commit of the ADR index: the PR that changed an ADR is in the changelog already
[commit_types]
index = { changelog_title = "ADR index", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "canarylang"
repository = "canary"
