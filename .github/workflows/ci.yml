name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      # a squash merge makes the title the commit on master, and `cog bump` reads that
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

  docs:
    name: Docs ids
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the ADR numbers the open PRs took
    steps:
      - uses: actions/checkout@v7
      - name: Test scripts/docs.py
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      # every ADR number and rule id once, every ADR header readable; on a PR, its ADR numbers
      # not taken by an older open PR
      - name: Every id once
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/docs.py check ${PR:+--open-prs "$PR"}

  book:
    name: Book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a hang fails the job in minutes, not GitHub's six hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml: the nightly it names, installed on first use
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
